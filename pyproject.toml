[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langform"
version = "0.3.0"
description = "Local-first Context Intelligence for indexing Assets and forming source-grounded Context Packages."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Nurdin Kaparov"}
]
keywords = ["context-intelligence", "context-frames", "retrieval", "local-llm", "mcp"]
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
documents = [
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1"
]
ollama = [
  "requests>=2.31"
]
mcp = [
  "mcp[cli]>=2.0,<3.0"
]
all = [
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "requests>=2.31",
  "mcp>=2.0,<3.0"
]
dev = [
  "pytest>=8.0"
]

[project.scripts]
langform = "langform.cli:main"
langform-mcp = "langform.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
